
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>LC Universal Radio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .logo {
      color: #fbbf24;
      font-size: 27px;
      font-weight: bold;
    }

    header p {
      color: #94a3b8;
      margin-bottom: 0;
    }

    main {
      width: 100%;
      max-width: 480px;
      margin: 35px auto;
      padding: 18px;
    }

    .player {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 22px;
      padding: 25px 20px;
      text-align: center;
    }

    .artwork {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      background: linear-gradient(135deg,#312e81,#0f766e,#b45309);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 25px;
      margin: 12px 0;
    }

    .subtitle {
      color: #cbd5e1;
    }

    .status {
      color: #4ade80;
      font-size: 13px;
      margin: 20px 0;
    }

    button {
      background: #fbbf24;
      color: #101827;
      border: none;
      border-radius: 50px;
      width: 76px;
      height: 76px;
      font-size: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    .volume {
      width: 100%;
      margin-top: 25px;
      accent-color: #fbbf24;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LC UNIVERSAL RADIO</div>
    <p>Tu música, tu estación</p>
  </header>

  <main>
    <section class="player">

      <div class="artwork">📻</div>

      <h1>LC Universal Radio</h1>

      <div class="subtitle">
        Música para todos
      </div>

      <div class="status">
        ● ESTACIÓN PREPARADA
      </div>

      <button id="play" aria-label="Reproducir">▶</button>

      <audio id="radio" preload="none"></audio>

      <input
        class="volume"
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8"
        aria-label="Volumen"
      >

      <p id="message">Esperando conexión de transmisión</p>

    </section>
  </main>

  <footer>
    LC Universal Radio · 2026
  </footer>

  <script>
    const radio = document.getElementById("radio");
    const play = document.getElementById("play");
    const volume = document.getElementById("volume");
    const message = document.getElementById("message");

    radio.volume = Number(volume.value);

    play.addEventListener("click", async () => {
      if (radio.paused) {
        if (!radio.src) {
          message.textContent =
            "La transmisión todavía no está configurada.";
          return;
        }

        try {
          await radio.play();
          play.textContent = "Ⅱ";
          message.textContent = "Conectado a la estación";
        } catch {
          message.textContent = "No se pudo iniciar la transmisión.";
        }
      } else {
        radio.pause();
        play.textContent = "▶";
        message.textContent = "Transmisión pausada";
      }
    });

    volume.addEventListener("input", () => {
      radio.volume = Number(volume.value);
    });

    radio.addEventListener("ended", () => {
      play.textContent = "▶";
    });

    radio.addEventListener("error", () => {
      play.textContent = "▶";
      message.textContent = "Error al conectar con la transmisión.";
    });
  </script>
  <script src="./app.js"></script>
</body>
</html>
